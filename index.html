<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      try {
        if (localStorage.getItem('portfolio-language') === 'fr') document.documentElement.lang = 'fr'
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" />
    <style>
      .portfolio-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        pointer-events: none;
        background: #04050e;
        color: #eaf0ff;
        animation: startup-exit 550ms ease-out 4.5s forwards;
      }
      .startup-label {
        position: absolute;
        inset: 28px auto auto 28px;
        color: #a5abc2;
        font: 11px system-ui, sans-serif;
        letter-spacing: .3em;
        text-transform: uppercase;
      }
      .startup-words {
        display: grid;
        place-items: center;
        font: italic clamp(3.5rem, 12vw, 7rem)/1 'Instrument Serif', Georgia, serif;
      }
      html:not([lang="fr"]) .startup-words[lang="fr"],
      html[lang="fr"] .startup-words[lang="en"] { display: none; }
      .startup-words span {
        grid-area: 1 / 1;
        --word-delay: 0ms;
        animation: startup-word-in 320ms ease-out var(--word-delay) both,
          startup-word-out 220ms ease-in calc(var(--word-delay) + 680ms) forwards;
      }
      .startup-words span:nth-child(2) { --word-delay: 900ms; }
      .startup-words span:last-child {
        --word-delay: 1800ms;
        animation: startup-word-in 320ms ease-out var(--word-delay) both;
      }
      .portfolio-loader i {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, #bdefff, #b6a1ff);
        transform-origin: left center;
        animation: startup-bar 2.7s linear forwards;
      }
      .portfolio-loader.is-ready { animation: startup-exit 550ms ease-out forwards; }
      @keyframes startup-word-in { from { opacity: 0; transform: translateY(20px); } }
      @keyframes startup-word-out { to { opacity: 0; transform: translateY(-20px); } }
      @keyframes startup-bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes startup-exit { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { .portfolio-loader { display: none; } }
    </style>
    <title>Wael Gasri — Portfolio</title>
  </head>
  <body>
    <div id="startup-loader" class="portfolio-loader" aria-hidden="true">
      <span class="startup-label">Portfolio</span>
      <div class="startup-words" lang="en"><span>Design</span><span>Create</span><span>Inspire</span></div>
      <div class="startup-words" lang="fr"><span>Concevoir</span><span>Créer</span><span>Inspirer</span></div>
      <i></i>
    </div>
    <script>performance.mark('portfolio-intro-start')</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
